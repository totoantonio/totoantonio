<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#F3F4F6"/>
  <rect x="40" y="36" width="1120" height="558" rx="26" fill="#FFFFFF" stroke="#D9DBDF" stroke-width="2"/>

  <circle cx="94" cy="91" r="20" fill="#1D1D1F"/>
  <text x="94" y="98" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">t</text>
  <text x="130" y="99" fill="#1D1D1F" font-family="Arial, sans-serif" font-size="24" font-weight="700">totoantonio</text>
  <path d="m286 84 8 8-8 8" fill="none" stroke="#96999F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="311" y="99" fill="#5E626B" font-family="Arial, sans-serif" font-size="23">Mac apps</text>

  <text x="91" y="216" fill="#1D1D1F" font-family="Arial, sans-serif" font-size="54" font-weight="700">Small mac Apps built with care</text>
  <text x="94" y="294" fill="#666A73" font-family="Arial, sans-serif" font-size="20" textLength="1016" lengthAdjust="spacing">I make practical Mac apps for small problems that interrupt your work and steal time.</text>
  <text x="94" y="330" fill="#666A73" font-family="Arial, sans-serif" font-size="20" textLength="1016" lengthAdjust="spacing">Each starts with a need from my own day and becomes clear, focused software that's easy to live with.</text>
  <text x="94" y="366" fill="#666A73" font-family="Arial, sans-serif" font-size="20" textLength="1016" lengthAdjust="spacing">I care about useful details, thoughtful design, privacy, and straightforward ways to buy software.</text>
  <text x="94" y="402" fill="#666A73" font-family="Arial, sans-serif" font-size="20" textLength="1016" lengthAdjust="spacing">No unnecessary features or subscription clutter, just tools that earn a place on your Mac.</text>

  <line x1="92" y1="485" x2="1108" y2="485" stroke="#E5E6E9" stroke-width="2"/>
  <text x="94" y="562" fill="#777B83" font-family="Arial, sans-serif" font-size="18">totoantonio.com</text>
  <text x="1106" y="562" fill="#777B83" font-family="Arial, sans-serif" font-size="18" text-anchor="end">Thoughtfully made for Mac.</text>
</svg>